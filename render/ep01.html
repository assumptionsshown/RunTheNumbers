<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ep01 - Lump Sum vs DCA</title>
<link rel="stylesheet" href="lib/slides.css">
</head>
<body>
<main id="deck"></main>

<script type="module">
import { gapHistogram, horizontalBars, dumbbell, tailAdvantage, verticalBars, COLORS } from "./lib/charts.js";

const r = await (await fetch("../episodes/ep01-lumpsum-vs-dca/results.json")).json();

const pct = (v, d = 1) => `${(v * 100).toFixed(d)}%`;
const signed = (v, d = 1) => `${v > 0 ? "+" : ""}${(v * 100).toFixed(d)}%`;
const win = (months) => r.baseCase.windows.find((w) => w.Months === months);
const w12 = win(12);

const deck = document.getElementById("deck");
const slides = [];

const slide = ({ eyebrow, title, sub, body, foot, cls = "" }) => slides.push(`
  <section class="slide ${cls}">
    ${eyebrow ? `<div class="slide__eyebrow">${eyebrow}</div>` : ""}
    ${title ? `<h1 class="slide__title">${title}</h1>` : ""}
    ${sub ? `<p class="slide__sub">${sub}</p>` : ""}
    <div class="slide__body">${body ?? ""}</div>
    <div class="slide__foot">
      <span>${foot ?? `Shiller S&amp;P Composite, ${r.meta.firstMonth} to ${r.meta.lastMonth}. Real total return.`}</span>
      <span>THE ASSUMPTION PANEL</span>
    </div>
  </section>`);

// 1 - Title -----------------------------------------------------------------
// A bare title card leaves the first twenty seconds with nothing to look at, which
// is the most expensive dead air available in a video. The headline number goes
// here so there is visual proof while the claim is still being made.
slide({
  cls: "slide--title",
  body: `
    <div class="brand">The Assumption Panel</div>
    <h1 class="slide__title" style="margin-top:28px;font-size:88px">Lump sum or spread it out?</h1>
    <div style="display:flex;align-items:baseline;gap:36px;margin-top:44px">
      <div class="stat__value is-lumpsum" style="font-size:170px">${pct(w12.LumpSumWinRate)}</div>
      <div style="font-size:36px;line-height:1.3;color:var(--muted);max-width:720px">
        of ${w12.Starts.toLocaleString()} starting months since ${r.meta.firstMonth.slice(0, 4)},
        investing it <span style="color:var(--ink)">all at once</span> came out ahead
      </div>
    </div>
    <p class="slide__sub" style="font-size:30px;margin-top:52px">
      Assumptions on screen. Code and data public.
    </p>`,
  foot: " ",
});

// 2 - Method ----------------------------------------------------------------
slide({
  eyebrow: "The test",
  title: "One dollar, two ways",
  sub: "Invest it all at once, or split it into twelve equal monthly purchases. Repeat for every possible starting month in 155 years, and hold both to the same day.",
  body: `
    <div class="stat-row">
      <div>
        <div class="stat__value is-lumpsum">${w12.Starts.toLocaleString()}</div>
        <div class="stat__label">starting months tested, ${r.meta.firstMonth} through ${r.meta.lastMonth}</div>
      </div>
      <div>
        <div class="stat__value is-dca">155</div>
        <div class="stat__label">years of monthly S&amp;P Composite data, inflation-adjusted, dividends reinvested</div>
      </div>
      <div>
        <div class="stat__value">0</div>
        <div class="stat__label">assumptions hidden from you. The full list is at the end of this video.</div>
      </div>
    </div>`,
});

// 3 - Headline --------------------------------------------------------------
slide({
  eyebrow: "The answer",
  title: `Investing it all at once won ${pct(w12.LumpSumWinRate)} of the time`,
  sub: `Each bar is one starting month. Left of the line, the lump sum ended ahead. Right of it, spreading the purchases did.`,
  body: `
    <div class="legend">
      <span style="color:${COLORS.lumpsum}">lump sum ahead</span>
      <span style="color:${COLORS.dca}">DCA ahead</span>
    </div>
    ${gapHistogram(r.baseCase.gapHistogram12mo)}`,
});

// 4 - By window -------------------------------------------------------------
slide({
  eyebrow: "Does a longer drip help?",
  title: "The longer you spread it, the more often you lose",
  sub: "Share of starting months where investing the whole amount immediately beat spreading it over the window.",
  body: horizontalBars(
    r.baseCase.windows.map((w) => ({
      label: `${w.Months} months`,
      value: w.LumpSumWinRate,
      display: pct(w.LumpSumWinRate),
      color: COLORS.lumpsum,
    })),
    { max: 1 },
  ),
});

// 5, 6 - Horizon independence, mechanism then measurement --------------------
slide({
  eyebrow: "The part nobody mentions",
  title: "Holding longer does not rescue the drip",
  sub: "",
  body: `
    <p class="slide__sub" style="font-size:38px;max-width:1560px">
      "Fine, but I'm a long-term investor. Give it twenty years and it evens out."
    </p>
    <p class="slide__sub" style="font-size:38px;max-width:1560px;color:var(--ink)">
      It doesn't. Not because of some subtle statistical effect. Because of arithmetic.
    </p>
    <p class="slide__sub" style="font-size:38px;max-width:1560px">
      After the final purchase, both versions of you own shares of the same index. Nothing else is
      different. Whoever ended up with more shares stays ahead by exactly the same percentage, forever.
    </p>
    <p class="note" style="font-size:32px;color:var(--dca)">
      The whole contest is decided during those twelve months.
    </p>`,
});

slide({
  eyebrow: "So we measured it",
  title: "The ratio does not move at all",
  sub: `Every start month, checked at ${r.horizonIndependence.horizons.join(", ")} years.`,
  body: `
    <div class="stat-row">
      <div>
        <div class="stat__value is-dca">${r.horizonIndependence.maxRatioDrift.toExponential(1)}</div>
        <div class="stat__label">largest change in the DCA-to-lump-sum ratio across every horizon tested. That is floating-point rounding, not an effect.</div>
      </div>
      <div>
        <div class="stat__value">${signed(w12.GapMedian, 2)}</div>
        <div class="stat__label">typical shortfall from spreading purchases over 12 months, and it is locked in the day the last purchase clears</div>
      </div>
    </div>
    <p class="note">"Time in the market" is usually said as advice about patience. Here it is arithmetic: the decision is settled during the twelve months, and nothing after that can change it.</p>`,
});

// 6 - The insurance ---------------------------------------------------------
// Only the horizons where the protection is actually measurable belong here.
// The decay is slide 7's job; showing it now would undercut the steelman before
// it has been fairly stated.
slide({
  eyebrow: "So why does anyone drip?",
  title: "Because it does buy a better disaster",
  sub: "The worst 5% of outcomes, per dollar, in real terms. In the first two years the drip really does land you higher when things go badly.",
  body: `
    <div class="legend">
      <span style="color:${COLORS.lumpsum}">lump sum</span>
      <span style="color:${COLORS.dca}">12-month DCA</span>
    </div>
    ${dumbbell(
      [1, 2, 3].map((y) => {
        const t = r.tailCrossover.find((x) => x.horizonYears === y);
        return { label: `${y} year${y > 1 ? "s" : ""}`, lumpSum: t.lumpSumP5, dca: t.dcaP5 };
      }),
      { xLabel: "5th-percentile real value per $1 invested" },
    )}
    <p class="note">At one year the drip's bad case is ${signed(
      r.tailCrossover[0].dcaP5 / r.tailCrossover[0].lumpSumP5 - 1, 1,
    )} better. That is the protection people are buying. Notice it has already almost gone by year three.</p>`,
});

// 7, 8, 9 - The price, the expiry, and the limit of the evidence -------------
// One chart across three slides. The bars fill in as the argument develops
// rather than landing all at once on a frame that then sits still for a minute
// and a half.
const tailPoints = r.tailCrossover.map((t) => ({
  label: `${t.horizonYears}y`,
  value: t.dcaTailAdvantage,
  // Anything under half a thousandth is zero for our purposes, and a "-0.000"
  // label reads as a real negative result.
  display: Math.abs(t.dcaTailAdvantage) < 0.0005 ? "0.000" : t.dcaTailAdvantage.toFixed(3),
  independentPeriods: t.independentPeriods,
}));

const costRange = r.tailCrossover.map((t) => Math.abs(t.dcaMedianCost));

slide({
  eyebrow: "First, the price",
  title: "The premium is charged at every horizon",
  sub: "How much median wealth the 12-month drip gives up, per holding period. There is no horizon where it stops costing something.",
  body: `
    ${tailAdvantage(
      r.tailCrossover.map((t) => ({
        label: `${t.horizonYears}y`,
        value: t.dcaMedianCost,
        display: `${(t.dcaMedianCost * 100).toFixed(1)}%`,
        independentPeriods: t.independentPeriods,
      })),
      {
        showNoise: false,
        aboveLabel: "drip ahead",
        belowLabel: "drip behind",
        xLabel: "years held after the final purchase",
      },
    )}
    <p class="note">
      Between ${pct(Math.min(...costRange), 1)} and ${pct(Math.max(...costRange), 1)} of the median outcome, every single time.
      Now the question is what that buys.
    </p>`,
});

slide({
  eyebrow: "Now, the protection",
  title: "It is real, and it is nearly gone by year three",
  sub: "Difference between the two 5th percentiles. Positive means the drip's bad case was better.",
  body: `
    ${tailAdvantage(tailPoints, { revealUpTo: 3, showNoise: false })}
    <p class="note">
      Two point three cents on the dollar at one year. One point nine at two.
      By three years it is ${tailPoints[2].display}, and the thing you are paying for every year has essentially stopped arriving.
    </p>`,
});

slide({
  eyebrow: "And past that",
  title: "We cannot measure it, so we are not going to claim it",
  sub: "The same chart, carried out to twenty years.",
  body: `
    ${tailAdvantage(tailPoints, { minPeriods: 40 })}
    <p class="note">
      These windows overlap, so 155 years does not give 155 independent tests. At a 20-year hold it gives
      ${r.tailCrossover.at(-1).independentPeriods}, and a 5th percentile cannot be read off
      ${r.tailCrossover.at(-1).independentPeriods} observations.
    </p>`,
});

// 8 - Worst starts ----------------------------------------------------------
slide({
  cls: "slide--table",
  eyebrow: "The eight worst months to invest in 155 years",
  title: "In two of them, the drip made it worse",
  sub: "Real value of $1, ten years after the final purchase.",
  body: `
    <table>
      <thead>
        <tr><th>Started</th><th>Lump sum</th><th>12-month DCA</th><th>Difference</th><th>CAPE at start</th></tr>
      </thead>
      <tbody>
        ${r.baseCase.worstLumpSumStarts.map((s) => `
          <tr class="${s.Gap < 0 ? "is-highlight" : ""}">
            <td>${s.Date}</td>
            <td>$${s.LumpSumMultiple.toFixed(3)}</td>
            <td>$${s.DcaMultiple.toFixed(3)}</td>
            <td>${signed(s.Gap, 1)}</td>
            <td>${s.StartingCape == null ? "n/a" : s.StartingCape.toFixed(1)}</td>
          </tr>`).join("")}
      </tbody>
    </table>
    <p class="note">
      Both failures are 1998, the two highest starting valuations in the table.
      The drip only helps if the market falls <em>while you are still buying</em>.
      In 1998 it kept rising, so the drip bought higher, and then the crash hit both.
    </p>`,
});

// 12 - The 1998 pathway ------------------------------------------------------
// This slide is replaced by an animated frame sequence at assembly time. What
// is drawn here is the poster frame: it keeps slide numbering aligned with the
// script and stands in if the animation has not been captured.
const path1998 = r.baseCase.pathways.find((p) => p.StartDate === "1998-04");
const path1998End = path1998.Points[path1998.Points.length - 1];
slide({
  eyebrow: "Watch one of them happen",
  title: "April 1998, month by month",
  sub: `$1 invested all at once against $1 spread over 12 months, followed to ${path1998End.Date}.`,
  body: `
    <div class="stat-row">
      <div>
        <div class="stat__value is-lumpsum">$${path1998End.LumpSum.toFixed(3)}</div>
        <div class="stat__label">all at once, in real terms, ten years after the final purchase</div>
      </div>
      <div>
        <div class="stat__value is-dca">$${path1998End.Dca.toFixed(3)}</div>
        <div class="stat__label">spread over twelve months</div>
      </div>
      <div>
        <div class="stat__value is-warn">${signed(path1998End.Dca / path1998End.LumpSum - 1, 1)}</div>
        <div class="stat__label">the drip came out behind, in exactly the scenario it is sold to protect against</div>
      </div>
    </div>
    <p class="note">${path1998.Note}</p>`,
});

// 13 - CAPE ------------------------------------------------------------------
const deciles = r.baseCase.capeDeciles;
const avgWin = deciles.reduce((s, d) => s + d.DcaWinRate, 0) / deciles.length;
slide({
  eyebrow: "But the market is expensive right now",
  title: "Starting valuation does not help you choose",
  sub: "Every starting month sorted into ten buckets by its CAPE ratio, cheapest to most expensive. How often did spreading purchases win?",
  body: `
    ${verticalBars(
      deciles.map((d) => ({
        label: `${d.CapeLow.toFixed(0)}-${d.CapeHigh.toFixed(0)}`,
        sublabel: `n=${d.Starts}`,
        value: d.DcaWinRate,
        display: pct(d.DcaWinRate, 0),
        color: d.Decile === 10 ? COLORS.warn : COLORS.dca,
      })),
      { max: 0.6, reference: avgWin, referenceLabel: `average ${pct(avgWin, 0)}`, xLabel: "starting CAPE ratio" },
    )}
    <p class="note">
      At the most expensive tenth of history, CAPE ${deciles[9].CapeLow.toFixed(0)} and up, spreading purchases won
      ${pct(deciles[9].DcaWinRate, 0)} of the time. That is <em>below</em> several of the cheaper buckets. There is no trend here to trade on.
    </p>`,
});

// 12, 13, 14 - Recap, the honest ending, and the panel -----------------------
slide({
  eyebrow: "All of it in one place",
  title: "Three findings",
  sub: "",
  body: `
    <div class="stat-row">
      <div>
        <div class="stat__value is-lumpsum">${pct(w12.LumpSumWinRate)}</div>
        <div class="stat__label">of ${w12.Starts.toLocaleString()} starting months, investing the whole amount immediately came out ahead</div>
      </div>
      <div>
        <div class="stat__value is-dca">0</div>
        <div class="stat__label">effect of holding longer. The outcome is fixed the day the final purchase clears</div>
      </div>
      <div>
        <div class="stat__value">2</div>
        <div class="stat__label">years, roughly, that the drip's better worst case can actually be demonstrated</div>
      </div>
    </div>`,
});

slide({
  eyebrow: "What it actually is",
  title: "Not risk insurance. Short-horizon regret insurance.",
  sub: "",
  body: `
    <p class="slide__sub" style="font-size:38px;max-width:1560px">
      It reliably improves your worst case for about two years. It costs a few percent of your median
      outcome to hold. Past three years we cannot show that it does anything at all.
    </p>
    <p class="slide__sub" style="font-size:38px;max-width:1560px;color:var(--ink)">
      But all of this assumes you actually invest. If splitting it into twelve pieces is the difference
      between putting the money in and leaving it in a savings account for three years, then
      ${pct(Math.abs(w12.GapMedian), 1)} is a very cheap price and you should pay it happily.
    </p>
    <p class="note" style="font-size:32px;color:var(--dca)">
      The worst outcome on this entire chart is not the drip. It is not being in the market.
    </p>`,
});

slide({
  eyebrow: "The assumption panel",
  title: "Everything this result rests on",
  sub: "Change any of these and the number changes. That is the point.",
  body: `
    <div class="assumptions">
      <ul>${r.meta.assumptions.map((a) => `<li>${a}</li>`).join("")}</ul>
      <div class="source">
        source: ${r.meta.snapshot.source}<br>
        snapshot ${r.meta.snapshot.fetchedAt} &middot; sha256 ${r.meta.snapshot.sha256.slice(0, 32)}...<br>
        ${r.meta.snapshot.months.toLocaleString()} months, ${r.meta.snapshot.firstMonth} to ${r.meta.snapshot.lastMonth}
        &middot; partial month ${r.meta.snapshot.droppedPartialMonth} dropped
      </div>
    </div>
    <p class="note">
      Sensitivity: if idle cash earns 0% nominal instead of holding its purchasing power, the lump sum wins
      ${pct(r.sensitivityZeroNominalCash.windows.find((w) => w.Months === 12).LumpSumWinRate)} of the time
      instead of ${pct(w12.LumpSumWinRate)}. The answer does not depend on that choice.
    </p>`,
});

// ?only=N isolates a single slide so a headless browser can capture it as a
// clean 1920x1080 frame with nothing else in the viewport.
const only = Number(new URLSearchParams(location.search).get("only"));
if (only >= 1 && only <= slides.length) {
  document.body.style.background = "#0d1117";
  deck.innerHTML = slides[only - 1].replace('class="slide ', 'style="margin:0" class="slide ');
} else {
  deck.innerHTML = slides.join("");
}

document.title = `Ep01 - ${slides.length} slides`;
// Signal to the capture script that rendering finished.
document.documentElement.dataset.slideCount = String(slides.length);
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
