function renderFrame(i) {
  const t = i / FPS, s = sceneOf(t);
  if (s === "kitchen") sceneKitchen(t, i);
  else if (s === "r72") sceneReplay(t, i, "r72", R72, 1972);

  else if (s === "why") sceneWhy(t, i);

  else if (s === "today") sceneToday(t, i);
  else if (s === "bin") sceneBin(t, i);
