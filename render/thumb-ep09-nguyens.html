<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail: ep09 The Nguyens</title>
<style>
  html, body { margin: 0; background: #fbf3df; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
// Thumbnails for ep09 "Stocks at a Record High: Wait for a Dip?" (2026-11-07), three for
// Test & Compare. Same kit as render/ep09-nguyens.html. Figures are validated by
// tools/validate-ep09-story.mjs and drawn live by the renderer.
//   ?anim=a  "WAIT FOR A DIP?" Uncle Tu (cash) vs Minh (every paycheck)
//   ?anim=b  "STARTED AT THE 2007 TOP ...AND STILL BEAT WAITING" (Oct 2007 start, Minh ahead ~$25k)
//   ?anim=c  "WON SMALL. LOST BIG." typical win ~$4k vs typical loss ~$25k
const which = new URLSearchParams(location.search).get("anim") ?? "a";
const W = 1280, H = 720;
const ctx = document.getElementById("c").getContext("2d");
const C = { paper: "#fbf3df", ink: "#1d1d1f", skin: "#efc39c", hair: "#2a2522", grey: "#9a9590", muted: "#7a7468", gold: "#ffcf4a",
  mint: "#e3f1ea", tuTint: "#eaf0dc", minh: "#5b8fc7", tu: "#8aa05a", tuDark: "#4f6330", minhDark: "#2e5d8f", red: "#e5646e", cash: "#d9e8c4" };
const FONT = '"Segoe UI", system-ui, sans-serif';
function text(s, x, y, { size = 48, fill = C.ink, weight = 900, stroke = 0, align = "center" } = {}) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = "#ffffff"; ctx.lineJoin = "round"; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function shape(fill, draw, lw = 7) { ctx.beginPath(); draw(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = C.ink; ctx.lineJoin = "round"; ctx.stroke(); } }
function person(cx, footY, o) {
  ctx.save(); ctx.translate(cx, footY); ctx.scale(o.s, o.s);
  shape("#4a4f5c", () => { ctx.rect(-45, -112, 38, 112); ctx.rect(7, -112, 38, 112); }, 6);
  const bw = o.belly ? 150 : 132;
  shape(o.shirt, () => ctx.roundRect(-bw / 2, -258, bw, 156, 30));
  shape(o.shirt, () => ctx.roundRect(-bw / 2 - 30, -244, 34, 114, 16), 6); shape(o.shirt, () => ctx.roundRect(bw / 2 - 4, -244, 34, 114, 16), 6);
  if (o.collar) shape("#ffffff", () => { ctx.moveTo(-26, -258); ctx.lineTo(0, -232); ctx.lineTo(26, -258); ctx.closePath(); }, 5);
  if (o.pocket) shape(null, () => ctx.rect(14, -228, 30, 28), 4);
  shape(C.skin, () => ctx.ellipse(0, -325, 62, 72, 0, 0, Math.PI * 2));
  if (o.hair === "short") shape(C.hair, () => { ctx.moveTo(-64, -318); ctx.ellipse(0, -330, 66, 76, 0, Math.PI, 0); ctx.lineTo(64, -318); ctx.quadraticCurveTo(40, -372, -10, -366); ctx.quadraticCurveTo(-48, -362, -64, -318); ctx.closePath(); }, 6);
  else {
    shape(C.grey, () => ctx.ellipse(-56, -340, 14, 30, 0.15, 0, Math.PI * 2), 5);
    shape(C.grey, () => ctx.ellipse(56, -340, 14, 30, -0.15, 0, Math.PI * 2), 5);
    shape(C.grey, () => ctx.ellipse(0, -392, 34, 10, 0, 0, Math.PI * 2), 4);
  }
  ctx.lineWidth = 5; ctx.strokeStyle = C.ink;
  ctx.beginPath(); ctx.arc(-24, -330, 16, 0, Math.PI * 2); ctx.moveTo(40, -330); ctx.arc(24, -330, 16, 0, Math.PI * 2); ctx.moveTo(-8, -330); ctx.lineTo(8, -330); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(-24, -330, 6, 0, Math.PI * 2); ctx.arc(24, -330, 6, 0, Math.PI * 2); ctx.fill();
  if (o.mustache) shape(C.grey, () => ctx.roundRect(-26, -305, 52, 11, 5), 4);
  ctx.lineWidth = 7; ctx.beginPath();
  if (o.worried) ctx.arc(0, -282, 20, 1.2 * Math.PI, 1.8 * Math.PI); else ctx.arc(0, -304, 24, 0.12 * Math.PI, 0.88 * Math.PI);
  ctx.stroke();
  ctx.restore();
}
const TU = { shirt: C.tu, hair: "receding", mustache: true, belly: true, pocket: true }, MINH = { shirt: C.minh, hair: "short", collar: true };
function cashStack(cx, footY, n) { for (let j = 0; j < n; j++) { const row = Math.floor(j / 3), col = j % 3; shape(C.cash, () => ctx.roundRect(cx - 120 + col * 82 + (row % 2) * 10, footY - 30 - row * 32, 76, 28, 5), 5); } }
function bag(cx, footY, r) {
  shape("#9ccf7e", () => ctx.ellipse(cx, footY - r, r, r, 0, 0, Math.PI * 2));
  shape("#9ccf7e", () => { ctx.moveTo(cx - r * 0.3, footY - 2 * r + 6); ctx.lineTo(cx, footY - 2 * r - r * 0.35); ctx.lineTo(cx + r * 0.3, footY - 2 * r + 6); ctx.closePath(); }, 6);
  text("$", cx, footY - r + r * 0.35, { size: r, fill: "#2f6b2a" });
}

if (which === "a") {
  ctx.fillStyle = C.tuTint; ctx.fillRect(0, 0, W / 2, H); ctx.fillStyle = C.mint; ctx.fillRect(W / 2, 0, W / 2, H);
  shape(null, () => { ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); }, 8);
  person(240, 1000, { ...TU, s: 1.45, worried: true }); cashStack(470, 700, 9);
  person(880, 1000, { ...MINH, s: 1.45 }); bag(1120, 700, 90);
  shape(C.gold, () => ctx.roundRect(110, 24, 1060, 150, 40), 8);
  text("WAIT FOR A DIP?", 640, 130, { size: 100 });
  text("WAIT", 320, 270, { size: 76, fill: C.tuDark, stroke: 12 });
  text("JUST BUY", 960, 270, { size: 76, fill: C.minhDark, stroke: 12 });
} else if (which === "b") {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  // a hand-drawn crash-and-recovery shape: decoration only, no data is read off it
  ctx.lineWidth = 12; ctx.strokeStyle = C.ink; ctx.lineJoin = "round"; ctx.beginPath();
  const pts = [[60, 330], [200, 320], [330, 600], [470, 520], [640, 470], [820, 380], [1000, 300], [1220, 200]];
  pts.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  shape(C.gold, () => ctx.arc(200, 320, 24, 0, Math.PI * 2), 6);
  text("STARTED AT THE 2007 TOP", 640, 110, { size: 74, fill: C.ink, stroke: 12 });
  text("...AND STILL BEAT WAITING", 640, 200, { size: 62, fill: C.minhDark, stroke: 12 });
  shape("#ffffff", () => ctx.roundRect(640, 520, 560, 150, 30), 8);
  text("+$25K", 920, 625, { size: 96, fill: C.minhDark });
} else {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  shape(C.gold, () => ctx.roundRect(90, 30, 1100, 150, 40), 8);
  text("WAIT FOR A DIP?", 640, 135, { size: 96 });
  shape("#ffffff", () => ctx.roundRect(90, 230, 520, 400, 34), 8);
  shape("#ffffff", () => ctx.roundRect(670, 230, 520, 400, 34), 8);
  text("WON SMALL", 350, 330, { size: 60, fill: C.tuDark }); text("+$4K", 350, 500, { size: 140, fill: C.tuDark });
  text("LOST BIG", 930, 330, { size: 60, fill: C.red }); text("-$25K", 930, 500, { size: 140, fill: C.red });
  text("typical result, 1,506 thirty-year windows", 640, 690, { size: 34, fill: C.muted, weight: 800 });
}
window.FRAME_COUNT = 1;
window.renderFrame = () => true;
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
