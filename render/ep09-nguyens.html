    { x0: 0, tint: C.tuTint, title: "UNCLE TU'S WAY · waits for a 10% drop", who: "T", cast: CAST.T, colour: C.tuDark },

  ];
  const max = scene === "r18" ? 90000 : 360000;
  const cur = lineAt(t);
  const payday = !!(cur && cur.speaker === "T" && cur.scene === scene && MONTH[cur.id] === k && SH[rp.i0 + k].dd <= -0.1);
  for (const s of sides) {
    ctx.fillStyle = s.tint; ctx.fillRect(s.x0, 390, 960, 646);
    text(s.title, s.x0 + 480, 428, { size: 30, fill: s.colour });
    person(s.x0 + 170, 900, { ...s.cast, s: 0.78, mouth: mouthOf(s.who, i, t), mood: 1 });
    // when Uncle Tu announces a buy, the frame shows that payday: this month's $500 paid in on
    // both sides and Tu's saved cash moved into stocks (the ledger's next step, before growth)
    let stock = valAt(rp.path, m, s.who === "T" ? "stock" : "minh"), cash = rp.path[k].cash;
    if (payday) { if (s.who === "T") { stock += cash + PAY; cash = 0; } else stock += PAY; }
    const bagX = s.who === "T" ? s.x0 + 420 : s.x0 + 600;
    moneyBag(bagX, 880, stock, max);
    text(`in stocks ${k$(stock)}`, bagX, 930, { size: 34 });
    if (s.who === "T") {
      cashPile(s.x0 + 740, 880, cash);
      text(`in cash ${usd(cash)}`, s.x0 + 740, 930, { size: 34, fill: C.tuDark });
    }
    let mine = null; for (const l of timing.lines) if (l.speaker === s.who && l.scene === scene && t >= l.start - 0.05) mine = l;
    if (mine && BUB[mine.id]) {
      const next = timing.lines.find((l) => l.start > mine.start && l.scene === scene && MONTH[l.id] !== MONTH[mine.id]);
      bubble(s.x0 + 170, 900 - 0.78 * 440 + 4, BUB[mine.id], s.colour, fade(t, mine.start, 0.2) * (next ? 1 - fade(t, next.start, 0.2) : 1));
    }
  }
  shape(null, () => { ctx.moveTo(960, 390); ctx.lineTo(960, 1036); }, 6);
  marketStrip(rp, m, 360, 80, 1480, 250);
  // the date
  shape("#ffffff", () => ctx.roundRect(30, 30, 290, 150, 22), 6);
  text(label(SH[rp.i0 + k].m), 175, 112, { size: 54, mono: true });
  text(`paid in ${usd((k + (payday ? 1 : 0)) * PAY)}`, 175, 158, { size: 26, fill: C.muted, weight: 700 });
  // lead meter: total (stocks + cash), Tu minus Minh
  const gap = valAt(rp.path, m, "stock") + rp.path[k].cash - valAt(rp.path, m, "minh");
  const fx = 960 + Math.sign(gap) * Math.min(1, Math.sqrt(Math.abs(gap) / 30000)) * 380;
  shape(null, () => { ctx.moveTo(560, 975); ctx.lineTo(1360, 975); }, 8);
  shape(gap >= 0 ? C.tu : C.minh, () => { ctx.moveTo(fx, 975); ctx.lineTo(fx, 949); ctx.lineTo(fx + (gap >= 0 ? -40 : 40), 958); ctx.lineTo(fx, 967); }, 5);

  const id = lineAt(t)?.id;

  if (scene === "r07" && id === "N06") stamp(620, 610, "6+ YEARS IN CASH", C.tuDark, -0.03, fade(t, tw("N06", "For more"), 0.3), 42);

  if (scene === "r07" && id === "N05") stamp(1520, 610, "DOWN ABOUT 1/3", C.red, -0.03, fade(t, tw("N05", "Minh's way is down"), 0.3), 42);

function sceneWhy(t, i) {

function sceneEvery(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);

  const cw = 14, ch = 22, x0 = 960 - (126 * cw) / 2, y0 = 130;

  const by = new Map(A10.map((x) => [x.m, x]));

    for (let mo = 1; mo <= 12; mo++) {
      const c = by.get(`${1871 + xi}-${String(mo).padStart(2, "0")}`);
      if (!c) continue;

      ctx.fillRect(x0 + xi * cw, y0 + (mo - 1) * ch, cw - 2, ch - 2);

  for (const yy of [1871, 1900, 1929, 1950, 1972, 1996]) { const xi = yy - 1871; if (xi / 126 <= reveal) text(String(yy), x0 + xi * cw + cw / 2, y0 + 12 * ch + 30, { size: 24, fill: C.muted, weight: 700 }); }
  card([["each square: one month to start 30 years of paychecks", C.muted, 36], [`buying every paycheck, typically: ~${k$(Math.round(median(A10.map((x) => x.minh)) / 10000) * 10000)} after 30 years`, C.minhDark, 42]],
    480, fade(t, tw("N09", "After thirty"), 0.4) * (1 - fade(t, L.N10.start - 0.2, 0.3)), 960, 1200);
  const a = fade(t, L.N10.start, 0.4);
  card([[`Uncle Tu's way ahead: ${WINS.length} of ${A10.length.toLocaleString("en-US")} (less than 1 in 4)`, C.tuDark, 44],
    [`when it won: usually by ~${k$(median(WINS))} · best ever ~${usd(Math.round(Math.max(...WINS) / 100) * 100)}`, C.tuDark, 40],
    [`when it lost: usually by ~${k$(median(LOSSES))} · worst ~${k$(Math.max(...LOSSES))}`, C.minhDark, 40]], 480, a, 960, 1300);
  text("blue: Minh's way ahead · green: Uncle Tu's way ahead", 960, 990, { size: 30, fill: C.muted, weight: 700, alpha: coloured });

function sceneLadder(t, i) {
  if (t < L.N11.start - 0.2) { kitchen(t, i); return honesty("now"); }
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  text("what waiting cost, for the typical start", 960, 90, { size: 52, alpha: fade(t, L.N11.start) });

function renderFrame(i) {
  const t = i / FPS, s = sceneOf(t);
  if (s === "kitchen") sceneKitchen(t, i);
  else if (s === "r18" || s === "r07") sceneReplay(t, i, s);
  else if (s === "why") sceneWhy(t, i);
  else if (s === "every") sceneEvery(t);
  else if (s === "ladder") sceneLadder(t, i);
  else if (s === "bin") sceneBin(t, i);
  else if (s === "answer") sceneAnswer(t);
  else if (s === "panel") scenePanel(t);
  else sceneClose(t, i);
  return true;
}
window.FRAME_COUNT = mouth.frames;
window.renderFrame = renderFrame;
window.renderAt = (seconds) => renderFrame(Math.round(seconds * FPS));
renderFrame(0);
document.documentElement.dataset.ready = "1";
