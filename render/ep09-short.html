<script type="module">

const W = 1080, H = 1920;
const ctx = document.getElementById("c").getContext("2d");
const load = async (p) => (await fetch(p)).json();
const EP = "../episodes/ep09-wait-for-a-dip/nguyens-short";

const FPS = mouth.fps;
const parse = (t) => { const [h, ...rows] = t.trim().split(/\r?\n/); const c = h.split(","); return rows.map((r) => Object.fromEntries(r.split(",").map((v, i) => [c[i], v]))); };

const SH = shCsv.filter((r) => r.cpi !== "" && Number.isFinite(+r.cpi) && r.price !== "").map((r) => ({ m: r.date, p: +r.price, real: +r.realTotalReturnPrice }));
{ let hi = 0; for (const r of SH) { hi = Math.max(hi, r.p); r.hi = hi; r.dd = r.p / hi - 1; } }

function run(i0, n, X, wantPath) {

  const path = wantPath ? [{ minh: 0, stock: 0, cash: 0, put: 0 }] : null;
  for (let k = 0; k < n; k++) {
    const g = SH[i0 + k + 1].real / SH[i0 + k].real;
    minh = (minh + PAY) * g; cash += PAY; let put = 0;
    if (SH[i0 + k].dd <= -X) { put = cash; stock += cash; cash = 0; }
    if (cash > 0) cashMonths++;
    stock *= g;
    if (wantPath) path.push({ minh, stock, cash, put });
  }
  return { m: SH[i0].m, i0, n, path, minh, tu: stock + cash, gap: stock + cash - minh, cashMonths };
}
const R = { r18: run(AT.get("2018-01"), LAST - AT.get("2018-01"), 0.1, true), r07: run(AT.get("2007-10"), LAST - AT.get("2007-10"), 0.1, true) };
const median = (xs) => { const s = [...xs].sort((a, b) => a - b), h = 0.5 * (s.length - 1), lo = Math.floor(h), hi = Math.ceil(h); return s[lo] + (h - lo) * (s[hi] - s[lo]); };
const windows = (X) => { const o = []; for (let i = 0; i + 360 <= LAST; i++) o.push(run(i, 360, X, false)); return o; };
const ALL = { 10: windows(0.1), 20: windows(0.2), 30: windows(0.3) };
const A10 = ALL[10], WINS = A10.filter((x) => x.gap > 0).map((x) => x.gap), LOSSES = A10.filter((x) => x.gap <= 0).map((x) => -x.gap);
const TYP = Object.fromEntries([10, 20, 30].map((X) => [X, median(ALL[X].map((x) => x.gap))]));
const claim = (ok, what) => { if (!ok) throw new Error(`ep09-vertical: claim false: ${what}`); };
const K = (v) => Math.round(v / 1000);
claim(K(R.r18.gap) === 2 && K(R.r07.minh) === 355 && K(R.r07.tu) === 330 && K(-R.r07.gap) === 25, "replays");
claim(R.r07.path[134].cash === 38000, "the cash pile");
claim(A10.length === 1506 && WINS.length / A10.length < 0.25 && K(median(WINS)) === 4 && K(median(LOSSES)) === 25, "every window");
claim(K(-TYP[10]) === 11 && K(-TYP[20]) === 20 && K(-TYP[30]) === 66, "ladder");
claim(timing.seconds < 70, "a one-minute Short");

// ---- timing
const L = Object.fromEntries(timing.lines.map((l) => [l.id, l]));
const TEXT = Object.fromEntries(script.lines.map((l) => [l.id, l.text.replace(/\*/g, "")]));
const MONTH = Object.fromEntries(script.lines.map((l) => [l.id, l.month ?? null]));
const tw = (id, phrase) => { const l = L[id], k = TEXT[id].indexOf(phrase); if (k < 0) throw new Error(`${id}: no "${phrase}"`); return l.start + (l.end - l.start) * k / TEXT[id].length; };
const sceneOf = (t) => { let s = timing.lines[0].scene; for (const l of timing.lines) if (t >= l.start - 0.2) s = l.scene; return s; };
const speaking = (t) => timing.lines.find((l) => t >= l.start && t <= l.end + 0.05) ?? null;
const lineAt = (t) => { let c = null; for (const l of timing.lines) if (t >= l.start - 0.2) c = l; return c; };
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const fade = (t, at, d = 0.3) => clamp01((t - at) / d);
const ease = (x) => x * x * (3 - 2 * x);
const keysFor = (scene) => { const k = []; let prev = 0; for (const l of timing.lines) { if (l.scene !== scene || MONTH[l.id] == null) continue; const mo = MONTH[l.id]; if (mo !== prev) k.push({ from: prev, to: mo, at: l.start, d: Math.min(3.5, 1.2 + (mo - prev) / 40) }); prev = mo; } return k; };
const KEYS = { r07: keysFor("r07") };
function monthAt(scene, t) { let m = 0; for (const k of KEYS[scene]) { if (t < k.at) break; m = k.from + (k.to - k.from) * ease(clamp01((t - k.at) / k.d)); } return m; }
const valAt = (path, m, key) => { const a = Math.floor(m), b = Math.min(path.length - 1, a + 1), f = m - a; return path[a][key] * (1 - f) + path[b][key] * f; };
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const label = (m) => { const [y, mo] = m.split("-"); return `${MON[+mo - 1]} ${y}`; };

// ---- kit
const C = { paper: "#fbf3df", ink: "#1d1d1f", skin: "#efc39c", hair: "#2a2522", grey: "#9a9590", muted: "#7a7468", red: "#e5646e", green: "#4caf5c",
  gold: "#ffcf4a", mint: "#e3f1ea", tuTint: "#eaf0dc", minh: "#5b8fc7", lan: "#e98a7a", bin: "#f2c14e", tu: "#8aa05a", tuDark: "#4f6330", minhDark: "#2e5d8f", lanDark: "#b0574a", cash: "#d9e8c4" };
const FONT = '"Segoe UI", system-ui, sans-serif', MONO = '"Cascadia Mono", Consolas, monospace';
function text(s, x, y, { size = 48, fill = C.ink, align = "center", weight = 800, mono = false, alpha = 1 } = {}) {

}
function shape(fill, draw, lw = 7) {

}
const usd = (v) => `$${Math.round(v).toLocaleString("en-US")}`;
const k$ = (v) => `$${Math.round(v / 1000).toLocaleString("en-US")}k`;

function person(cx, footY, o) {

  if (o.pocket) shape(null, () => ctx.rect(14, -228, 30, 28), 4);

  else if (o.hair === "long") shape(C.hair, () => { ctx.moveTo(-70, -300); ctx.ellipse(0, -330, 72, 82, 0, Math.PI, 0); ctx.lineTo(70, -300); ctx.quadraticCurveTo(58, -360, 10, -362); ctx.quadraticCurveTo(-40, -352, -70, -300); ctx.closePath(); }, 6);

const CAST = {

function bubble(cx, bottomY, s, colour, alpha, tail = true) {

  const bw = Math.max(...rows.map((r) => ctx.measureText(r).width)) + 60, bh = rows.length * 50 + 36;
  const bx = Math.max(20, Math.min(W - bw - 60, cx - bw / 2)), by = bottomY - bh - (tail ? 26 : 0);

  const h = 44 + laid.reduce((a, [, , size]) => a + size + 22, 0), x = (W - w) / 2;

}
function moneyBag(cx, footY, v, max) {

    shape("#9ccf7e", () => { ctx.moveTo(cx - r * 0.3, footY - 2 * r + 6); ctx.lineTo(cx, footY - 2 * r - r * 0.35); ctx.lineTo(cx + r * 0.3, footY - 2 * r + 6); ctx.closePath(); }, 6);

function cashPile(cx, footY, v) {

// ---- scenes
const KITCHEN_BUBBLE = {};
function kitchen(t, i, dim = 0) {

  ctx.fillStyle = "#efe3c6"; ctx.fillRect(0, 1500, W, 420);
  shape(null, () => { ctx.moveTo(0, 1500); ctx.lineTo(W, 1500); }, 6);
  shape("#c99a6b", () => ctx.roundRect(250, 1330, 580, 34, 12), 6);
  shape("#a77a4f", () => { ctx.rect(290, 1364, 24, 136); ctx.rect(766, 1364, 24, 136); }, 6);
  for (const [k, o] of Object.entries(CAST)) person(o.x, 1500, { ...o, mouth: mouthOf(k === "BIN" ? "X" : k, i, t) });
  text("LAN", CAST.L.x, 1556, { size: 34 }); text("MINH", CAST.M.x, 1556, { size: 34 });
  text("BIN", CAST.BIN.x, 1556, { size: 34 }); text("UNCLE TU", CAST.T.x, 1556, { size: 34 });

function sceneKitchen(t, i) {

  const at = tw("S01", "Uncle Tu keeps");

  card([["UNCLE TU (top)", C.tuDark, 52], ["keeps the $500 in cash until", C.ink, 42], ["the market is 10% down", C.ink, 42],
    ["MINH (bottom)", C.minhDark, 52], ["buys every paycheck", C.ink, 42]], 310, fade(t, at, 0.3));
}

  shape("#ffffff", () => ctx.roundRect(x0 - 20, y0 - 56, w + 40, h + 80, 18), 5);
  text("THE MARKET", x0, y0 - 18, { size: 28, fill: C.muted, align: "left", weight: 800 });
  for (let j = 0; j <= Math.min(n, m); j++) if (ps[j].dd <= -0.1) { ctx.fillStyle = "rgba(138,160,90,0.28)"; ctx.fillRect(X(j) - w / n / 2, y0, w / n + 0.5, h); }
  const upto = k;
  ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.strokeStyle = C.red; ctx.beginPath();
  for (let j = 0; j <= upto; j++) { const x = X(j), y = Y(ps[j].hi); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]);
  ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.beginPath();
  for (let j = 0; j <= upto; j++) { const x = X(j), y = Y(ps[j].p); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  const cur = ps[k];
  shape(cur.dd <= -0.1 ? C.tu : C.gold, () => ctx.arc(X(k), Y(cur.p), 11, 0, Math.PI * 2), 4);
  const tag = cur.dd === 0 ? "AT A RECORD" : cur.dd <= -0.1 ? `${Math.round(-cur.dd * 100)}% DOWN · TU BUYS` : `${Math.round(-cur.dd * 100)}% down · Tu waits`;
  text(tag, x0 + w, y0 - 18, { size: 30, fill: cur.dd <= -0.1 ? C.tuDark : cur.dd === 0 ? C.red : C.muted, align: "right", weight: 900 });
}
const BUB = { S03: "10% down. I buy!", S04: "Down about a third.", S05: "A record. I stop buying." };
function sceneReplay(t, i, scene) {

  marketStrip(rp, m, k, 80, 240, 920, 210);
  const max = scene === "r18" ? 90000 : 360000;
  const halves = [
    { y0: 520, tint: C.tuTint, title: "UNCLE TU · waits for a 10% drop", who: "T", cast: CAST.T, colour: C.tuDark },
    { y0: 1040, tint: C.mint, title: "MINH · buys every paycheck", who: "M", cast: CAST.M, colour: C.minhDark },

  if (id === "S06") pill("6+ YEARS IN CASH", C.tuDark, fade(t, tw("S06", "For more"), 0.25), 360, "#ffffff", 50);
  if (id === "S07") pill(`MINH WINS BY ~$${K(-rp.gap)}K`, C.minhDark, fade(t, tw("S07", "Minh's way wins"), 0.25), 360, "#ffffff", 50);
}
function sceneEvery(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  text("every 30-year window", W / 2, 260, { size: 64, alpha: fade(t, L.V13.start) });
  text("since 1871", W / 2, 335, { size: 64, alpha: fade(t, L.V13.start) });
  const cw = 8, ch = 32, x0 = (W - 126 * cw) / 2, y0 = 380;
  const reveal = clamp01((t - L.V13.start - 0.3) / 6);
  const coloured = fade(t, tw("V13", "Blue means"), 0.4);
  const by = new Map(A10.map((x) => [x.m, x]));
  for (let xi = 0; xi < 126; xi++) {
    if (xi / 126 > reveal) continue;
    for (let mo = 1; mo <= 12; mo++) {
      const c = by.get(`${1871 + xi}-${String(mo).padStart(2, "0")}`);
      if (!c) continue;
      ctx.fillStyle = coloured > 0.5 ? (c.gap > 0 ? C.tu : C.minh) : "#d8d0bd";
      ctx.fillRect(x0 + xi * cw, y0 + (mo - 1) * ch, cw - 1, ch - 2);
    }
  }
  for (const yy of [1871, 1929, 1972, 1996]) { const xi = yy - 1871; if (xi / 126 <= reveal) text(String(yy), Math.min(1000, Math.max(70, x0 + xi * cw)), y0 + 12 * ch + 42, { size: 30, fill: C.muted, weight: 700 }); }
  const lg = coloured, ly = y0 + 12 * ch + 92;
  if (lg > 0.01) {
    ctx.globalAlpha = lg; ctx.fillStyle = C.minh; ctx.fillRect(110, ly - 26, 34, 34); ctx.fillStyle = C.tu; ctx.fillRect(560, ly - 26, 34, 34); ctx.globalAlpha = 1;
    text("Minh's way ahead", 156, ly, { size: 36, align: "left", fill: C.minhDark, alpha: lg }); text("Uncle Tu's ahead", 606, ly, { size: 36, align: "left", fill: C.tuDark, alpha: lg });
  }
  card([["waiting won less than 1 in 4", C.tuDark, 56], [`when it won: usually ~${k$(median(WINS))}`, C.tuDark, 48], [`when it lost: usually ~${k$(median(LOSSES))}`, C.minhDark, 48]], 970, fade(t, L.V14.start, 0.3));
  footer("30 years of $500/mo · real S&P history with dividends, after inflation");
}
function sceneLadder(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  text("what waiting cost", W / 2, 230, { size: 72 }); text("for the typical start", W / 2, 305, { size: 52, fill: C.muted });
  text("each bar is the drop Uncle Tu waits for", W / 2, 380, { size: 38, fill: C.muted, weight: 700, alpha: fade(t, tw("V15", "Each bar")) });
  const x0 = 120, w = 840, y0 = 470, rh = 260, maxCost = 70000;
  const when = { 10: "Ten percent", 20: "Twenty:", 30: "Thirty:" };
  [10, 20, 30].forEach((X, k) => {
    const y = y0 + k * rh, base = fade(t, tw("V15", "Each bar"), 0.3), a = fade(t, tw("V15", when[X]), 0.3);
    if (base <= 0.01) return;
    text(`wait for ${X}%`, x0, y - 20, { size: 50, align: "left", alpha: base });
    ctx.globalAlpha = base; shape("#efe3c6", () => ctx.roundRect(x0, y, w, 110, 16), 5); ctx.globalAlpha = 1;
    if (a <= 0.01) return;
    const bw = w * (-TYP[X] / maxCost) * ease(a);
    shape(C.tu, () => ctx.roundRect(x0, y, Math.max(1, bw), 110, 16), 5);
    text(`-${k$(-TYP[X])}`, Math.min(x0 + bw + 20, x0 + w - 200), y + 76, { size: 58, align: "left", alpha: a, fill: C.lanDark });
  });
  footer("typical (median) result over 1,506 thirty-year windows, 1871-2026");
}
function sceneAnswer(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);

function scenePanel(t) {

  const rows = ["Stocks: S&P with dividends, no fees, no taxes", "$500 a month in today's money, never skipped", "Drops measured on monthly averages",
    "Uncle Tu's cash keeps up with inflation (generous to waiting)", "30-year windows overlap and share eras", "The family are illustrations; the history is real"];
  const al = fade(t, L.V17.start - 0.1, 0.4);

function sceneClose(t, i) {

  card([["every 30-year window since 1871", C.muted, 44], ["waiting for a dip won", C.ink, 60], ["less than 1 time in 4", C.tuDark, 66]], 120, fade(t, L.S08.start, 0.3));

  text("Tu's cash keeps up with inflation · the family are illustrations", W / 2, 1730, { size: 25, fill: C.muted, weight: 600 });

function renderFrame(i) {
  const t = i / FPS, s = sceneOf(t);
  if (s === "kitchen") sceneKitchen(t, i);
  else if (s === "r07") sceneReplay(t, i, s);
  else sceneClose(t, i);
  return true;
}
window.FRAME_COUNT = mouth.frames;
window.renderFrame = renderFrame;
window.renderAt = (seconds) => renderFrame(Math.round(seconds * FPS));
renderFrame(0);
document.documentElement.dataset.ready = "1";
</script>
