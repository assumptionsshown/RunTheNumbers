<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shorts</title>
<style>
  html, body { margin: 0; background: #0d1117; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>

<script type="module">
// Vertical cuts of the episode animations, 1080x1920.
//
// These are re-drawn for the frame rather than cropped from the wide versions.
// Cropping a 16:9 chart to 9:16 throws away most of the chart, which is the only
// thing worth watching.
//
// Shorts are watched small, often muted, and abandoned in about a second, so:
// the hook is on screen from frame zero, type is large enough to read on a phone
// at arm's length, and the payoff number is always visible rather than saved for
// the end.
//
//   ?anim=path1998|feecurve|histogram|threemonths [&fps=30] [&seconds=N]

const C = {
  bg: "#0d1117",
  ink: "#f0f4f8",
  muted: "#8b98a5",
  rule: "#263140",
  lumpsum: "#f0a35e",
  dca: "#4dc9c0",
  warn: "#e5646e",
};

const FONT = '"Segoe UI", system-ui, sans-serif';
const MONO = '"Cascadia Mono", Consolas, monospace';

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const W = canvas.width;

const params = new URLSearchParams(location.search);
const which = params.get("anim") ?? "path1998";
const FPS = Number(params.get("fps") ?? 30);
const seconds = Number(params.get("seconds") ?? 0);

const clamp01 = (t) => Math.max(0, Math.min(1, t));

const ep01 = await (await fetch("../episodes/ep01-lumpsum-vs-dca/results.json")).json();
const ep02 = await (await fetch("../episodes/ep02-fees/results.json")).json();
const ep03 = await (await fetch("../episodes/ep03-buying-at-the-top/results.json")).json();
const ep04 = await (await fetch("../episodes/ep04-rent-vs-buy/results.json")).json();
const ep05 = await (await fetch("../episodes/ep05-mortgage-or-invest/results.json")).json();
const ep06 = await (await fetch("../episodes/ep06-four-percent-rule/results.json")).json();
const ep07 = await (await fetch("../episodes/ep07-15-vs-30-year/results.json")).json();

// Dialogue shorts change on the speaker turn, not on a fraction of the runtime,
// so the turn boundaries are measured from the audio by tools/build-dialogue.mjs
// and read back here. Typing these numbers is how the visuals drift.
const timing = which === "threemonths"
  ? await (await fetch("../episodes/shorts/timing-threemonths.json")).json()
  : null;

function clear() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, canvas.height);
}

function label(text, x, y, { size = 40, fill = C.muted, align = "center", weight = 400, mono = false } = {}) {
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`;
  ctx.fillStyle = fill;
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
}

/** Hook lines at the top, and the wordmark at the very bottom. */
function frameChrome(lines) {
  lines.forEach((l, i) => {
    label(l.text, 60, 190 + i * 92, {
      size: 76, align: "left", weight: 750, fill: l.fill ?? C.ink,
    });
  });
  label("THE ASSUMPTION PANEL", W / 2, 1855, { size: 30, fill: C.rule, weight: 600 });
}

/** Greedy wrap. Returns the lines; the caller decides where to put them. */
function wrap(text, maxWidth, { size = 60, weight = 400 } = {}) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const next = line ? `${line} ${word}` : word;
    if (ctx.measureText(next).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = next;
    }
  }
  if (line) lines.push(line);
  return lines;
}

// Speakers are told apart by weight, position and a rule, never by hue. The
// palette's colours already mean something in the data (orange is lump sum,
// teal is the drip), and borrowing them for "who is talking" would make the
// chart lie the moment a question mentioned either one.
function quoteCard(text, y, { size = 66, alpha = 1, source = "from the comments" } = {}) {
  ctx.globalAlpha = alpha;
  const lines = wrap(text, W - 240, { size, weight: 600 });

  ctx.fillStyle = C.rule;
  ctx.fillRect(70, y - size, 8, lines.length * (size + 22));

  label("“", 118, y - size + 66, { size: 130, fill: C.rule, align: "left", weight: 700 });
  lines.forEach((l, i) => {
    label(l, 130, y + i * (size + 22), { size, fill: C.ink, align: "left", weight: 600 });
  });
  label(source, 130, y + lines.length * (size + 22) + 26, { size: 34, fill: C.muted, align: "left" });
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// 1. April 1998, the two lines separating.
// ---------------------------------------------------------------------------
const path = ep01.baseCase.pathways.find((p) => p.StartDate === "1998-04");

function path1998Frame(i, frames) {
  const p = clamp01(i / (frames - 1));
  const exact = p * (path.Points.length - 1);
  const whole = Math.floor(exact);
  const frac = exact - whole;

  clear();
  frameChrome([
    { text: "The worst month in" },
    { text: "155 years to invest" },
  ]);

  const plot = { left: 90, right: W - 70, top: 470, bottom: 1330 };
  const all = path.Points.flatMap((q) => [q.LumpSum, q.Dca]);
  const lo = Math.min(...all) * 0.92;
  const hi = Math.max(...all) * 1.06;
  const x = (k) => plot.left + (k / (path.Points.length - 1)) * (plot.right - plot.left);
  const y = (v) => plot.bottom - ((v - lo) / (hi - lo)) * (plot.bottom - plot.top);

  ctx.fillStyle = "rgba(77, 201, 192, 0.10)";
  ctx.fillRect(plot.left, plot.top, x(path.WindowMonths - 1) - plot.left, plot.bottom - plot.top);
  label("still buying", (plot.left + x(path.WindowMonths - 1)) / 2, plot.top - 22, { size: 30, fill: C.dca });

  ctx.strokeStyle = C.rule;
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(plot.left, y(1));
  ctx.lineTo(plot.right, y(1));
  ctx.stroke();
  ctx.setLineDash([]);
  label("$1", plot.left - 18, y(1) + 12, { size: 28, align: "right" });

  const next = path.Points[Math.min(whole + 1, path.Points.length - 1)];
  const draw = (key, colour) => {
    const tipY = y(path.Points[whole][key] + (next[key] - path.Points[whole][key]) * frac);
    ctx.strokeStyle = colour;
    ctx.lineWidth = 7;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    for (let k = 0; k <= whole; k++) {
      const px = x(k), py = y(path.Points[k][key]);
      k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.lineTo(x(exact), tipY);
    ctx.stroke();
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.arc(x(exact), tipY, 14, 0, Math.PI * 2);
    ctx.fill();
  };
  draw("LumpSum", C.lumpsum);
  draw("Dca", C.dca);

  const last = path.Points[whole];
  const gap = last.Dca / last.LumpSum - 1;

  label(last.Date, W / 2, 1420, { size: 84, fill: C.muted, weight: 700, mono: true });

  label("all at once", 60, 1530, { size: 34, fill: C.lumpsum, align: "left" });
  label(`$${last.LumpSum.toFixed(2)}`, 60, 1602, { size: 68, fill: C.lumpsum, align: "left", weight: 700, mono: true });

  label("spread over 12 months", W - 60, 1530, { size: 34, fill: C.dca, align: "right" });
  label(`$${last.Dca.toFixed(2)}`, W - 60, 1602, { size: 68, fill: C.dca, align: "right", weight: 700, mono: true });

  // The caption has to track the number underneath it. Asserting "made it worse"
  // while the gap is positive would be a caption that is false at that frame,
  // which is exactly the thing this channel is not allowed to do.
  const behind = gap < 0;
  label(
    behind ? "spreading it out is BEHIND" : "spreading it out is ahead",
    W / 2, 1700, { size: 38, fill: behind ? C.warn : C.dca, weight: 700 },
  );
  label(`${gap > 0 ? "+" : ""}${(gap * 100).toFixed(1)}%`, W / 2, 1780, {
    size: 76, fill: behind ? C.warn : C.dca, weight: 800, mono: true,
  });
}

// ---------------------------------------------------------------------------
// 2. The fee curves climbing.
// ---------------------------------------------------------------------------
const COLOURS = { 0.0003: "#7bc86f", 0.0025: C.dca, 0.005: C.muted, 0.01: C.lumpsum, 0.02: C.warn };
// Emphasis stays on 1%, matching the hook. Emphasising 2% while the headline says
// "it's only 1%" makes the viewer track the wrong line.
const curves = ep02.feeCurves.map((c) => ({
  fee: c.fee,
  colour: COLOURS[c.fee] ?? C.muted,
  emphasis: Math.abs(c.fee - 0.01) < 1e-9,
  points: c.points.map((q) => ({ x: q.HorizonYears, y: q.ShareOfGainLost })),
}));

function feeCurveFrame(i, frames) {
  const p = clamp01(i / (frames - 1));
  // The curve is the resolved first claim, so it completes in the first 55% of
  // the runtime. The remainder belongs to the bridge: a second question opened
  // out loud, with the CTA on screen. Per the bridge rule in decisions/0005.
  const year = 1 + clamp01(p / 0.55) * 39;

  clear();
  frameChrome([
    { text: '"It\'s only 1%"' },
    { text: "Here is 40 years of it", fill: C.muted },
  ]);

  const plot = { left: 120, right: W - 190, top: 600, bottom: 1330 };
  const x = (v) => plot.left + ((v - 1) / 39) * (plot.right - plot.left);
  const y = (v) => plot.bottom - (v / 0.65) * (plot.bottom - plot.top);

  ctx.strokeStyle = C.rule;
  ctx.lineWidth = 1;
  for (let t = 0; t <= 4; t++) {
    const v = (0.65 / 4) * t;
    ctx.beginPath();
    ctx.moveTo(plot.left, y(v));
    ctx.lineTo(plot.right, y(v));
    ctx.stroke();
    label(`${Math.round(v * 100)}%`, plot.left - 16, y(v) + 10, { align: "right", size: 28 });
  }

  for (const c of curves) {
    const whole = Math.floor(year) - 1;
    const frac = year - Math.floor(year);
    const a = c.points[whole];
    const b = c.points[Math.min(whole + 1, c.points.length - 1)];
    const tipY = a.y + (b.y - a.y) * frac;

    ctx.strokeStyle = c.colour;
    ctx.lineWidth = c.emphasis ? 8 : 4;
    ctx.globalAlpha = c.emphasis ? 1 : 0.6;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    for (let k = 0; k <= whole; k++) {
      const px = x(c.points[k].x), py = y(c.points[k].y);
      k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.lineTo(x(year), y(tipY));
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.fillStyle = c.colour;
    ctx.beginPath();
    ctx.arc(x(year), y(tipY), c.emphasis ? 13 : 8, 0, Math.PI * 2);
    ctx.fill();
    label(`${(c.fee * 100).toFixed(2)}%`, x(year) + 22, y(tipY) + 10, {
      align: "left", size: c.emphasis ? 34 : 28, fill: c.colour,
      weight: c.emphasis ? 700 : 400, mono: true,
    });
  }

  label(`${Math.round(year)} years`, W / 2, 1440, { size: 64, fill: C.muted, weight: 700, mono: true });
  label("share of your GAIN taken by the fee", W / 2, 1530, { size: 36 });

  // The headline number tracks the 1% line, the one the hook names.
  const onePct = curves.find((c) => Math.abs(c.fee - 0.01) < 1e-9);
  const nowY = onePct.points[Math.max(0, Math.floor(year) - 1)].y;
  label(`${(nowY * 100).toFixed(1)}%`, W / 2, 1660, { size: 110, fill: C.lumpsum, weight: 800, mono: true });
  label("at just 1% a year", W / 2, 1730, { size: 36, fill: C.lumpsum });

  // The bridge. Fades in once the curve has finished making its own point.
  const bridge = clamp01((p - 0.62) / 0.08);
  if (bridge > 0) {
    ctx.globalAlpha = bridge * 0.92;
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 560, W, 780);
    ctx.globalAlpha = bridge;
    label("So is 1% ever worth paying?", W / 2, 760, { size: 66, fill: C.ink, weight: 750 });
    label("It is, if it stops you panic selling.", W / 2, 860, { size: 44, fill: C.muted });
    label("I simulated a panic seller against", W / 2, 1010, { size: 44, fill: C.muted });
    label("a fee payer, every crash, 30 years.", W / 2, 1070, { size: 44, fill: C.muted });
    const cta = clamp01((p - 0.82) / 0.06);
    if (cta > 0) {
      ctx.globalAlpha = cta;
      label("the count is in the full video", W / 2, 1240, { size: 52, fill: C.dca, weight: 750 });
      label("link below", W / 2, 1310, { size: 36, fill: C.dca });
    }
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------------
// 3. The histogram filling as history runs.
// ---------------------------------------------------------------------------
const series = ep01.baseCase.gapSeries12mo;

function histogramFrame(i, frames) {
  const p = clamp01(i / (frames - 1));
  // History finishes playing at 58% of the runtime; the remainder is the bridge.
  const shown = Math.round(clamp01(p / 0.58) * series.gaps.length);

  clear();
  frameChrome([
    { text: "Lump sum or" },
    { text: "spread it out?" },
  ]);

  const plot = { left: 80, right: W - 60, top: 620, bottom: 1330 };
  const LOW = -0.2, HIGH = 0.2, BIN = 0.01;
  const x = (v) => plot.left + ((v - LOW) / (HIGH - LOW)) * (plot.right - plot.left);

  const counts = new Map();
  let wins = 0;
  for (let k = 0; k < shown; k++) {
    const g = series.gaps[k];
    if (g < 0) wins++;
    const b = Math.floor(g / BIN);
    counts.set(b, (counts.get(b) ?? 0) + 1);
  }

  const maxCount = 108;
  const y = (c) => plot.bottom - (c / maxCount) * (plot.bottom - plot.top);

  for (const [bin, count] of counts) {
    const lo = bin * BIN;
    if (lo < LOW || lo >= HIGH) continue;
    ctx.fillStyle = lo + BIN <= 1e-7 ? C.lumpsum : C.dca;
    ctx.fillRect(x(lo) + 1, y(count), Math.max(2, x(lo + BIN) - x(lo) - 2), plot.bottom - y(count));
  }

  ctx.strokeStyle = C.ink;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x(0), plot.top - 10);
  ctx.lineTo(x(0), plot.bottom + 14);
  ctx.stroke();

  label("lump sum won", x(0) - 20, plot.bottom + 62, { size: 30, align: "right", fill: C.lumpsum });
  label("spreading won", x(0) + 20, plot.bottom + 62, { size: 30, align: "left", fill: C.dca });

  const startYear = Number(series.firstDate.slice(0, 4));
  const year = startYear + Math.floor(Math.max(0, shown - 1) / 12);
  const rate = shown > 0 ? wins / shown : 0;

  label(String(year), W / 2, 1470, { size: 78, fill: C.muted, weight: 700, mono: true });
  label(`${(rate * 100).toFixed(1)}%`, W / 2, 1640, { size: 130, fill: C.lumpsum, weight: 800, mono: true });
  label("of all start months since 1871,", W / 2, 1710, { size: 36 });
  label("investing it all at once won", W / 2, 1758, { size: 36, fill: C.ink });

  // The bridge, per decisions/0005: the 67.2% claim is fully resolved above;
  // what opens here is the reversal, which the long video explains.
  const bridge = clamp01((p - 0.66) / 0.08);
  if (bridge > 0) {
    ctx.globalAlpha = bridge * 0.92;
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 540, W, 800);
    ctx.globalAlpha = bridge;
    label("But in the 8 worst months ever,", W / 2, 740, { size: 54, fill: C.ink, weight: 700 });
    label("the answer FLIPS", W / 2, 830, { size: 66, fill: C.warn, weight: 800 });
    label("and twice, spreading it out", W / 2, 990, { size: 44, fill: C.muted });
    label("made things WORSE", W / 2, 1055, { size: 44, fill: C.warn, weight: 700 });
    const cta = clamp01((p - 0.85) / 0.06);
    if (cta > 0) {
      ctx.globalAlpha = cta;
      label("which two months? full video", W / 2, 1220, { size: 52, fill: C.dca, weight: 750 });
      label("link below", W / 2, 1290, { size: 36, fill: C.dca });
    }
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------------
// 4. Question and answer: does a shorter window fix it?
// ---------------------------------------------------------------------------
// Two speakers, so the screen has to say who is talking without a face and
// without borrowing the data colours. A question is a quoted card behind a
// rule; the answer is the chart itself.
const Q1 = "I wouldn't spread it over a whole year. I'd do it in three months.";
const Q2 = "But the market is expensive right now.";
const ladder = ep01.baseCase.windows.map((w) => ({
  months: w.Months, rate: w.LumpSumWinRate, behind: w.GapMedian,
}));
// The narration rounds this to "seventeen hundred"; the screen should not.
const capeStarts = ep01.baseCase.capeDeciles.reduce((n, d) => n + d.Starts, 0);

function threeMonthsFrame(i) {
  const t = i / FPS;
  const beat = (k) => timing.turns[k];
  // Fade in `dur` seconds after beat k starts, then stay.
  const since = (k, delay = 0, dur = 0.45) =>
    clamp01((t - (beat(k).start + delay)) / dur);
  // Progress across a beat, finishing a little early so the number has landed
  // before the sentence about it ends.
  const across = (k) => clamp01((t - beat(k).start) / ((beat(k).end - beat(k).start) * 0.72));

  clear();
  label("THE ASSUMPTION PANEL", W / 2, 1855, { size: 30, fill: C.rule, weight: 600 });

  const opened = clamp01((t - (beat(1).start - 0.5)) / 0.5);
  if (opened < 1) quoteCard(Q1, 780, { size: 78, alpha: 1 - opened });
  if (opened === 0) return;

  // The question stays pinned once it is being answered, so a viewer who
  // arrives mid-Short still knows what the chart is arguing with.
  ctx.globalAlpha = opened;
  ctx.fillStyle = C.rule;
  ctx.fillRect(60, 118, 6, 92);
  label("“I'd do it in three months”", 96, 172, { size: 40, fill: C.muted, align: "left", weight: 600 });
  label("every starting month since 1871", W / 2, 350, { size: 40, fill: C.muted });
  ctx.globalAlpha = 1;

  // Everything stays inside x 60..950 and above y 1600: on a phone the Shorts
  // player puts its button rail down the right edge and the title across the
  // bottom, and a number under either of those may as well not be drawn.
  const plotLeft = 300, plotRight = 650;
  const barX = (rate) => plotLeft + rate * (plotRight - plotLeft);
  const rowY = (k) => 600 + k * 168;

  const headers = since(2);
  if (headers > 0) {
    ctx.globalAlpha = headers;
    label("all at once won", plotLeft, 505, { size: 32, align: "left" });
    label("drip finished behind", 950, 505, { size: 32, align: "right" });
    ctx.globalAlpha = 1;
  }

  ladder.forEach((w, k) => {
    // Beat 1 names the four windows, so the rows arrive with the words.
    const row = since(1, 0.5 + k * 0.55, 0.4);
    if (row === 0) return;
    ctx.globalAlpha = row;
    label(`${w.months} months`, 60, rowY(k) + 14, { size: 44, fill: C.ink, align: "left", weight: 600 });

    ctx.fillStyle = C.rule;
    ctx.fillRect(plotLeft, rowY(k) - 30, plotRight - plotLeft, 52);
    ctx.globalAlpha = 1;

    // Beat 2 is the median shortfall, beat 3 is the win rate. Each number
    // appears while it is being said, and not before.
    const cost = since(2, 0.6 + k * 0.35, 0.4);
    if (cost > 0) {
      ctx.globalAlpha = cost;
      label(`${(w.behind * 100 * across(2)).toFixed(1)}%`, 950, rowY(k) + 12, {
        size: 38, fill: C.muted, align: "right", weight: 700, mono: true,
      });
      ctx.globalAlpha = 1;
    }

    const grown = since(3, 0.3 + k * 0.3, 0.4) * across(3);
    if (grown > 0) {
      ctx.fillStyle = C.lumpsum;
      ctx.fillRect(plotLeft, rowY(k) - 30, (barX(w.rate) - plotLeft) * grown, 52);
      ctx.globalAlpha = since(3, 0.3 + k * 0.3, 0.4);
      label(`${(w.rate * 100 * grown).toFixed(1)}%`, 665, rowY(k) + 12, {
        size: 42, fill: C.lumpsum, align: "left", weight: 700, mono: true,
      });
      ctx.globalAlpha = 1;
    }
  });

  // The whole claim is that no bar reaches this line, so the line is drawn from
  // the same scale as the bars rather than placed by eye.
  const flip = since(3, 0, 0.5);
  if (flip > 0) {
    ctx.globalAlpha = flip;
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 10]);
    ctx.beginPath();
    ctx.moveTo(barX(0.5), rowY(0) - 72);
    ctx.lineTo(barX(0.5), rowY(3) + 52);
    ctx.stroke();
    ctx.setLineDash([]);
    label("a coin flip", barX(0.5), rowY(3) + 100, { size: 32, fill: C.ink });
    ctx.globalAlpha = 1;
  }

  // Beat 4, the conclusion, sits below the chart instead of covering it. The
  // viewer should be able to check the sentence against the bars while it is
  // being said.
  const dial = since(4, 0.2, 0.5);
  if (dial > 0) {
    ctx.globalAlpha = dial;
    label("Not a third option.", W / 2, 1380, { size: 62, fill: C.ink, weight: 750 });
    label("A dial.", W / 2, 1470, { size: 62, fill: C.warn, weight: 800 });
    label("turn it down and you are back to all at once", W / 2, 1560, { size: 38, fill: C.muted });
    ctx.globalAlpha = 1;
  }

  // Beat 5, the second question, and beat 6, where it is answered.
  const asked = since(5, 0, 0.4);
  if (asked > 0) {
    // Nearly opaque, not a wash. At 0.9 the table reads straight through the
    // quote and the two compete; the narration has moved on, so the chart
    // should too.
    ctx.globalAlpha = asked * 0.985;
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 96, W, 1664);
    ctx.globalAlpha = 1;
    quoteCard(Q2, 700, { size: 74, alpha: asked });

    const cta = since(6, 0.2, 0.5);
    if (cta > 0) {
      ctx.globalAlpha = cta;
      label("ten valuation buckets,", W / 2, 1120, { size: 52, fill: C.ink, weight: 700 });
      label(`${capeStarts.toLocaleString("en-US")} starting months`, W / 2, 1190, { size: 52, fill: C.ink, weight: 700 });
      label("the answer is in the full video", W / 2, 1360, { size: 50, fill: C.dca, weight: 750 });
      label("link below", W / 2, 1430, { size: 36, fill: C.dca });
      ctx.globalAlpha = 1;
    }
  }
}

// ---------------------------------------------------------------------------
// 5. Forty years of buying nothing but the yearly high.
// ---------------------------------------------------------------------------
// Straight narration rather than the dialogue grammar above, deliberately: the
// question-and-answer format is still an unpublished test, and running it on a
// second Short at the same time would mean two variables moving at once.
const savers = ["january", "peak", "cash"].map((s) => ({
  key: s,
  label: { january: "never thought about it", peak: "bought the yearly high", cash: "waited for a better price" }[s],

const ep04Base = ep04.scenarioTable.find((s) => s.scenario === "base");

const winAt5 = (s) => s.byHold.find((h) => h.holdYears === 5).buyWinRate;

// and both transaction costs are identical. That is what licenses the narration
// to say "one assumption", so it is asserted here rather than trusted.
for (const k of ["propertyTax", "insurance", "buyCost", "sellCost"]) {
  if (ep04Base[k] !== ep04Stress[k]) {

// The narration carries a 600ms lead-in, added 2026-08-21 after the founder
// reported losing the opening words on a slow connection. Every Short on this
// channel starts speaking at t=0 (topbuyer has 0.107s of head silence), so the
// first words are the first thing a buffering player eats, and here those words
// are the hook. The visual clock has to skip the same lead or the screen changes
// six tenths of a second before the voice explains it.
const LEAD_FRAMES = Math.round(0.6 * FPS);

function oneAssumptionFrame(i, frames) {
  const p = clamp01((i - LEAD_FRAMES) / (frames - 1 - LEAD_FRAMES));
  const at = (from, dur = 0.06) => clamp01((p - from) / dur);

  clear();

  // The hook is on screen from frame zero, because a short is abandoned in about
  // a second and a setup slide spends that second on nothing.
  frameChrome([
    { text: "Buy or rent?" },
    { text: `${ep04.headline.metros} US metros, 5 years`, fill: C.muted },
  ]);

  // NEITHER number is interpolated, and that is a correctness rule rather than a
  // taste one. Tweening maintenance from 1% to 4% renders frames reading "3% of
  // the home's value" beside "buying wins 82%", which is a pairing no run in
  // results.json produces; 3% is not even a scenario. Tweening the win rate has
  // the same defect in the other direction. So the readouts hold real values and
  // cut, and the announced change is drawn as an explicit "1% -> 4%" rather than
  // as a number passing through values nobody modelled.
  // Beats measured from the narration with ffmpeg silencedetect, not estimated.
  // The first pass was guessed and ran up to two seconds ahead of the voice: the
  // readout flipped to 31% while the narrator was still saying "same houses, same
  // cities", which is the line about what did NOT change. Spoken landmarks, in
  // seconds into this audio: "Maintenance," 3.87, "to four." 5.5, "Same houses"
  // 11.5, "thirty one percent" 14.5, "One assumption" 17.35.
  const announced = p >= 0.255;
  const flipped = p >= 0.713;

  const win = flipped ? winAt5(ep04Stress) : winAt5(ep04Base);
  const maintPct = (v) => `${(v * 100).toFixed(0)}%`;

  label("buying wins", W / 2, 640, { size: 52, fill: C.muted });
  label(`${Math.round(win * 100)}%`, W / 2, 880, {
    size: 240, fill: flipped ? C.warn : C.dca, weight: 800, mono: true,
  });
  label("of the time", W / 2, 950, { size: 44, fill: C.muted });

  const same = at(0.567, 0.05);
  if (same > 0) {
    ctx.globalAlpha = same;
    label("same houses. same cities. same five years.", W / 2, 1090, { size: 40, fill: C.muted });
    ctx.globalAlpha = 1;
  }

  // Brought forward from 0.172 on founder feedback, 2026-08-21. At the old timing
  // the "1% of the home's value" state existed for 1.6 seconds before it became
  // "1% -> 4%", which is not long enough to read what the number even is. It now
  // lands at 2.33s, as the voice finishes "Then I changed one number", so the
  // screen answers WHICH number while the ear is still holding the question. That
  // gives 3.2 seconds on the unchanged value before anything moves.
  const showMaint = at(0.09, 0.04);
  if (showMaint > 0) {
    ctx.globalAlpha = showMaint;
    label("maintenance, per year", W / 2, 1260, { size: 44, fill: C.muted });
    // Before the flip the screen states the change rather than a scenario, so it
    // never claims a maintenance figure that the standing answer above was not
    // computed under.
    const text = flipped
      ? `${maintPct(ep04Stress.maintenance)} of the home's value`
      : announced
        ? `${maintPct(ep04Base.maintenance)}  →  ${maintPct(ep04Stress.maintenance)}`
        : `${maintPct(ep04Base.maintenance)} of the home's value`;
    label(text, W / 2, 1340, {
      size: 58, fill: announced ? C.lumpsum : C.ink, weight: 750,
    });
    ctx.globalAlpha = 1;
  }

  // Resolves one claim and opens no second question, so it carries no bridge
  // CTA. Ruled compliant with 0005 by Codex on 2026-08-21.
  const close = at(0.869, 0.05);
  if (close > 0) {
    ctx.globalAlpha = close;
    label("one assumption", W / 2, 1530, { size: 62, fill: C.ink, weight: 800 });
    label("changed the answer", W / 2, 1605, { size: 54, fill: C.warn, weight: 750 });
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------------
// 10. Rate band: every modelled start at 7-8%, split exactly by decade.
//
// Built 2026-10-02 while the survey rate sits back above 7%, so the one claim
// the narration makes about TODAY ("back above seven percent") is news context,
// not a pinned figure, and no number on screen depends on it. Every figure drawn
// comes from ep05's pinned cohorts30 and byRateBucket30.
//
// Naming rule: these are modelled start months, never borrowers or real
// mortgages, and the frame says so in its footer for the whole runtime.
// ---------------------------------------------------------------------------
const rbBucket = ep05.byRateBucket30.find((b) => b.RateLow === 7 && b.RateHigh === 8);
const rbRuns = ep05.cohorts30
  .filter((c) => c.ratePercent >= rbBucket.RateLow && c.ratePercent < rbBucket.RateHigh)
  .sort((a, b) => a.month.localeCompare(b.month));
const rbInvest = rbRuns.filter((c) => c.investWon);
const rbPrepay = rbRuns.filter((c) => !c.investWon);

// The narration's claims, asserted against the pinned file rather than trusted.
if (rbRuns.length !== rbBucket.Cohorts) throw new Error("rateband: filter disagrees with byRateBucket30");
if (rbInvest.length !== rbPrepay.length) throw new Error("rateband: the split is not even");
if (rbInvest.at(-1).month >= rbPrepay[0].month) throw new Error("rateband: outcomes are not separated by era");

// Closest-rate opposite pair, found by search, not chosen by hand.
let rbPair = null;
for (const a of rbInvest) for (const b of rbPrepay) {
  const d = Math.abs(a.ratePercent - b.ratePercent);
  if (!rbPair || d < rbPair.d) rbPair = { d, a, b };
}
if (rbPair.a.month !== "1972-09" || rbPair.b.month !== "1993-06") {
  throw new Error(`rateband: narration names 1972-09 / 1993-06, search found ${rbPair.a.month} / ${rbPair.b.month}`);
}

const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const rbMonth = (m) => `${MONTHS[Number(m.slice(5)) - 1]} ${m.slice(0, 4)}`;
const rbYears = (rows) => `${rows[0].month.slice(0, 4)}-${rows.at(-1).month.slice(0, 4)}`;

function rateBandFrame(i) {
  // Beats keyed to seconds measured in audio/rateband.wav with ffmpeg
  // silencedetect, not to fractions of the runtime.
  const t = i / FPS;
  const at = (from, dur = 0.3) => clamp01((t - from) / dur);

  clear();
  frameChrome([
    { text: `Rates back above ${rbBucket.RateLow}%.` },
    { text: "Pay down or invest?", fill: C.muted },
  ]);

  const COLS = 9;
  const gx = (k) => 300 + (k % COLS) * 80;
  const gy = (k) => 560 + Math.floor(k / COLS) * 76;
  const investRows = Math.ceil(rbInvest.length / COLS);

  // The uncoloured grid is on screen from frame zero so the hook never sits over
  // six seconds of empty frame; its label lands with "I modelled every month" 6.30s.
  const gridIn = at(6.3, 0.5);
  if (gridIn > 0) {
    ctx.globalAlpha = gridIn;
    label(`${rbRuns.length} modelled start months, rate ${rbBucket.RateLow}-${rbBucket.RateHigh}%`, W / 2, 470, { size: 38, fill: C.ink, weight: 650 });
    ctx.globalAlpha = 1;
  }
  const colourInvest = t >= 14.2;
  const colourPrepay = t >= 17.06;
  rbRuns.forEach((c, k) => {
    const lit = c.investWon ? colourInvest : colourPrepay;
    ctx.fillStyle = lit ? (c.investWon ? C.dca : C.lumpsum) : C.rule;
    ctx.beginPath();
    ctx.arc(gx(k), gy(k), 24, 0, Math.PI * 2);
    ctx.fill();
  });

  // "Investing finished ahead twenty seven times" 14.20s, "twenty seven" 17.98s.
  const invIn = at(14.2);
  if (invIn > 0) {
    ctx.globalAlpha = invIn;
    label(`${rbInvest.length}  investing finished ahead`, 120, 1050, { size: 44, fill: C.dca, align: "left", weight: 750 });
    ctx.globalAlpha = 1;
  }
  const preIn = at(17.06);
  if (preIn > 0) {
    ctx.globalAlpha = preIn;
    label(`${rbPrepay.length}  paying it down finished ahead`, 120, 1112, { size: 44, fill: C.lumpsum, align: "left", weight: 750 });
    ctx.globalAlpha = 1;
  }

  // "Every start in the early seventies" 20.66s, "in the nineties" 23.96s.
  const eraA = at(20.66);
  if (eraA > 0) {
    ctx.globalAlpha = eraA;
    label(rbYears(rbInvest), 240, gy(COLS) + 12, { size: 34, fill: C.dca, align: "right", weight: 700, mono: true });
    ctx.globalAlpha = 1;
  }
  const eraB = at(23.96);
  if (eraB > 0) {
    ctx.globalAlpha = eraB;
    label(rbYears(rbPrepay), 240, gy(COLS * (investRows + 1)) + 12, { size: 34, fill: C.lumpsum, align: "right", weight: 700, mono: true });
    ctx.globalAlpha = 1;
  }
  // The era boundary itself, once both eras are named.
  if (eraB > 0) {
    ctx.globalAlpha = eraB;
    ctx.fillStyle = C.ink;
    ctx.fillRect(270, (gy(COLS * (investRows - 1)) + gy(COLS * investRows)) / 2 - 2, 670, 4);
    ctx.globalAlpha = 1;
  }

  // "September seventy two" 27.08s, "June ninety three" 28.79s.
  const ring = (c, colour) => {
    const k = rbRuns.indexOf(c);
    ctx.strokeStyle = colour;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(gx(k), gy(k), 36, 0, Math.PI * 2);
    ctx.stroke();
  };
  // Both rates printed to four places, which is the precision the pinned monthly
  // average carries for 1993-06; rounding either one would hide the gap.
  const pairRow = (c, y, colour, verdict) => {
    label(rbMonth(c.month), 120, y, { size: 46, fill: colour, align: "left", weight: 750, mono: true });
    label(`${c.ratePercent.toFixed(4)}%`, 600, y, { size: 46, fill: colour, align: "right", weight: 750, mono: true });
    label(verdict, 650, y, { size: 46, fill: colour, align: "left", weight: 750 });
  };
  const pairA = at(27.08);
  if (pairA > 0) {
    ctx.globalAlpha = pairA;
    ring(rbPair.a, C.ink);
    pairRow(rbPair.a, 1225, C.dca, "invest");
    ctx.globalAlpha = 1;
  }
  const pairB = at(28.79);
  if (pairB > 0) {
    ctx.globalAlpha = pairB;
    ring(rbPair.b, C.ink);
    pairRow(rbPair.b, 1293, C.lumpsum, "pay down");
    ctx.globalAlpha = 1;
  }

  // "The rate didn't decide it." 34.12s, "The next thirty years did." 35.95s.
  const closeA = at(34.12);
  if (closeA > 0) {
    ctx.globalAlpha = closeA;
    label("the rate didn't decide it", W / 2, 1410, { size: 54, fill: C.ink, weight: 750 });
    ctx.globalAlpha = 1;
  }
  const closeB = at(35.95);
  if (closeB > 0) {
    ctx.globalAlpha = closeB;
    label("the next 30 years did", W / 2, 1488, { size: 60, fill: C.warn, weight: 800 });
    ctx.globalAlpha = 1;
  }

  // Assumption panel, compressed, on frame for the whole runtime, and above the
  // band where the Shorts player overlays the title and channel name.
  label("Model: 30-yr fixed at that month's Freddie Mac average.", W / 2, 1570, { size: 27, fill: C.muted });
  label(`Spare cash ${ep05.baseCase.spareShare === 0.5 ? "half a payment" : ep05.baseCase.spareShare + " payment"}. S&P total return. No tax, no refinancing.`, W / 2, 1610, { size: 27, fill: C.muted });
}

const ANIMATIONS = {
  rateband: { fallback: 37.51, draw: rateBandFrame },
  oneassumption: { fallback: 19.81, draw: oneAssumptionFrame },
  path1998: { fallback: 34, draw: path1998Frame },
  topbuyer: { fallback: 41.1, draw: topBuyerFrame },
  retireyear: { fallback: 42.05, draw: retireYearFrame },
  samerate: { fallback: 50, draw: sameRateFrame },
  steadypath: { fallback: 55.9, draw: steadyPathFrame },
  feecurve: { fallback: 26, draw: feeCurveFrame },
  histogram: { fallback: 30, draw: histogramFrame },
  threemonths: { fallback: timing?.seconds ?? 55, draw: threeMonthsFrame },
};

const animation = ANIMATIONS[which];
if (!animation) throw new Error(`unknown short "${which}"`);

const frameCount = Math.round((seconds > 0 ? seconds : animation.fallback) * FPS);
window.FRAME_COUNT = frameCount;
window.renderFrame = (i) => {
  animation.draw(i, frameCount);
  return true;
};

window.renderFrame(0);
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
