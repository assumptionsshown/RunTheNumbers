  text("every 30-year start", W / 2, 260, { size: 64, alpha: fade(t, L.V16.start) });
  text("since 1871, all at 7%", W / 2, 335, { size: 64, alpha: fade(t, L.V16.start) });
  const cw = 8, ch = 32, x0 = (W - 126 * cw) / 2, y0 = 380;
  const reveal = clamp01((t - L.V16.start - 0.3) / 6);
  const coloured = fade(t, tw("V16", "Blue means"), 0.4);
  const by = new Map(ALL7.map((x) => [x.m, x]));
  for (let xi = 0; xi < 126; xi++) {
    if (xi / 126 > reveal) continue;
    for (let mo = 1; mo <= 12; mo++) {
      const c = by.get(`${1871 + xi}-${String(mo).padStart(2, "0")}`);
      if (!c) continue;
      ctx.fillStyle = coloured > 0.5 ? (c.gap > 0 ? C.minh : C.lan) : "#d8d0bd";
      ctx.fillRect(x0 + xi * cw, y0 + (mo - 1) * ch, cw - 1, ch - 2);
    }
  }
  for (const yy of [1871, 1929, 1972, 1996]) { const xi = yy - 1871; if (xi / 126 <= reveal) text(String(yy), Math.min(1000, Math.max(70, x0 + xi * cw)), y0 + 12 * ch + 42, { size: 30, fill: C.muted, weight: 700 }); }
  const lg = coloured, ly = y0 + 12 * ch + 92;
  if (lg > 0.01) {
    ctx.globalAlpha = lg; ctx.fillStyle = C.minh; ctx.fillRect(90, ly - 26, 34, 34); ctx.fillStyle = C.lan; ctx.fillRect(560, ly - 26, 34, 34); ctx.globalAlpha = 1;
    text("investing ahead", 136, ly, { size: 36, align: "left", fill: C.minhDark, alpha: lg }); text("paying down ahead", 606, ly, { size: 36, align: "left", fill: C.lanDark, alpha: lg });
  }
  card([[`investing ahead in ${Math.round(LADDER[4].win * 100)}%`, C.minhDark, 60], [`when it won: usually by ~${k$(Math.round(median(WINS7) / 10000) * 10000)}`, C.minhDark, 46],
    [`when it lost: usually by ~${k$(Math.round(median(LOSSES7) / 10000) * 10000)}`, C.lanDark, 46]], 970, fade(t, L.V17.start, 0.3));
  footer("what-if: a fixed 7% against real stock history (S&P with dividends)");
}
function sceneLadder(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  text("how often investing", W / 2, 165, { size: 64 }); text("came out ahead", W / 2, 240, { size: 64 });
  text("each bar is one mortgage rate", W / 2, 300, { size: 38, fill: C.muted, weight: 700, alpha: fade(t, tw("V18", "Each bar")) });
  const x0 = 170, w = 640, y0 = 350, rh = 145;
  const when = { 3: "five percent", 4: "five percent", 5: "five percent", 6: "At six", 7: "At seven", 8: "At eight" };
  LADDER.forEach((l, k) => {
    // the empty tracks are on screen while the narrator explains how to read them
    const y = y0 + k * rh, base = fade(t, tw("V18", "Each bar"), 0.3), a = fade(t, tw("V18", when[l.p]), 0.3);
    if (base <= 0.01) return;
    text(`${l.p}%`, x0 - 20, y + 74, { size: 58, align: "right", alpha: base });
    ctx.globalAlpha = base; shape("#efe3c6", () => ctx.roundRect(x0, y, w, 104, 16), 5); ctx.globalAlpha = 1;
    if (a <= 0.01) return;
    shape(l.win >= 0.5 ? C.minh : C.lan, () => ctx.roundRect(x0, y, Math.max(1, w * l.win * ease(a)), 104, 16), 5);
    text(`${Math.round(l.win * 100)}%`, x0 + w + 16, y + 70, { size: 50, align: "left", alpha: a });
    if (l.p === 7) text("Minh and Lan", x0 + 22, y + 66, { size: 38, fill: "#ffffff", align: "left", alpha: a });
  });
  const midX = x0 + w / 2;
  ctx.setLineDash([12, 10]); shape(null, () => { ctx.moveTo(midX, y0 - 14); ctx.lineTo(midX, y0 + rh * 6 - 30); }, 5); ctx.setLineDash([]);
  card([["higher rate: paying it off saves more", C.ink, 44]], 1250, fade(t, tw("V18", "The higher"), 0.3));
  footer("out of 1,506 what-if starts, 1871-1996, real stock history");
}
function sceneBin(t, i) {
  kitchen(t, i, t >= L.V20.start ? 0.25 : 0);
  const b = fade(t, tw("V19", "holds up"), 0.2) * (1 - fade(t, L.V20.start + 2, 0.3));
  // above the adults' heads, so it covers nobody's face
  bubble(CAST.BIN.x, 1140, "Why not both?", "#1f3c63", b);
  const pct = (n) => `${Math.round(n / ALL7.length * 100)}%`;
  card([["half to the bank, half to stocks", C.muted, 42], [`${pct(BETWEEN)}: ends between the other two`, C.ink, 46],
    [`${pct(BOTTOM)}: ends with less than both`, C.lanDark, 46], [`${pct(TOP)}: ends with more than both`, C.minhDark, 46]], 170, fade(t, L.V20.start, 0.3));
  footer("what-if: a fixed 7% against real stock history");
}
function sceneAnswer(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  shape(C.gold, () => ctx.roundRect(90, 280, 900, 150, 44), 8);
  text("YOUR RATE DECIDES", W / 2, 380, { size: 74, weight: 900 });
  const a1 = fade(t, L.V21.start + 0.8), a2 = fade(t, tw("V21", "Around seven")), a3 = fade(t, tw("V21", "Paying down"));
  text("5% or below: investing won every time", W / 2, 530, { size: 44, fill: C.minhDark, alpha: a1 });
  text("8%: it won less than half", W / 2, 595, { size: 44, fill: C.lanDark, alpha: a1 });
  card([["Around 7%, investing usually won", C.minhDark, 52], ["only if you invest every month, through every crash", C.muted, 42]], 680, a2);
  card([["Paying down: smaller, surer win", C.lanDark, 52], ["a fixed 7% that no crash can touch", C.muted, 42]], 1010, a3);
}
function scenePanel(t) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  text("THE ASSUMPTION PANEL", W / 2, 290, { size: 64 });
  text("what we assumed", W / 2, 350, { size: 40, fill: C.muted, weight: 700 });
  const rows = ["Stocks: S&P with dividends, no fees", "The $800 goes in every month, never skipped", "No taxes, no refinancing (which would likely help investing)",
    "1972 and 1993 use real Freddie Mac rates; the fixed rates are what-ifs", "Dollars: money of the start month, loan scaled to $400,000", "The family are illustrations; the history is real"];
  const al = fade(t, L.V22.start - 0.1, 0.4);
  let y = 400;
  for (const r of rows) {
    const laid = wrap(r, 38, 700, 860), h = laid.length * 50 + 36;
    ctx.globalAlpha = al; shape("#ffffff", () => ctx.roundRect(60, y, 960, h, 18), 5); ctx.globalAlpha = 1;
    laid.forEach((s, k) => text(s, 95, y + 54 + k * 50, { size: 38, align: "left", weight: 700, alpha: al }));
    y += h + 22;
  }
}
function sceneClose(t, i) {
  kitchen(t, i);
  card([["What's your rate?", C.ink, 72], ["Lan's bank or Minh's stocks?", C.muted, 50], ["tell us in the comments", C.minhDark, 46]], 300, fade(t, L.V23.start, 0.3));
}

function renderFrame(i) {
  const t = i / FPS, s = sceneOf(t);
  if (s === "kitchen") sceneKitchen(t, i);
  else if (s === "r93" || s === "r72") sceneReplay(t, i, s);
  else if (s === "every") sceneEvery(t);
  else if (s === "ladder") sceneLadder(t);
  else if (s === "bin") sceneBin(t, i);
  else if (s === "answer") sceneAnswer(t);
  else if (s === "panel") scenePanel(t);
  else sceneClose(t, i);
  return true;
}
window.FRAME_COUNT = mouth.frames;
window.renderFrame = renderFrame;
window.renderAt = (seconds) => renderFrame(Math.round(seconds * FPS));
renderFrame(0);
document.documentElement.dataset.ready = "1";
</script>
